<section class="section outcomes-section">
  <div class="shell"><h2 class="h2-display" data-split>Selected outcomes</h2></div>
  <div class="shell outcomes-grid-wrap">
    <div class="grid border-l border-t border-line sm:grid-cols-2 lg:grid-cols-3">
      {% for item in profile.highlights %}
      <div class="outcome-card border-b border-r border-line" data-reveal>
        <span class="outcome-number font-display font-thin leading-none text-paper/90">{{ '%02d' | format(loop.index) }}</span>
        <p class="outcome-copy text-[15px] leading-[1.55] text-paper/80 max-w-[34ch]">{{ item }}</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>

{% from 'partials/_macros.html' import chip_list, ticks %}
<section class="relative border-t border-line" aria-label="Areas of practice"><div class="shell py-6 flex justify-between"><span class="label">Areas of practice</span><span class="label">04</span></div>
{% for row in profile.expertise %}<article class="border-t border-line"><div class="shell grid gap-8 py-16 md:py-20 lg:grid-cols-12 lg:items-center lg:gap-x-6 lg:py-28">
<div class="relative aspect-[4/3] border border-line bg-stage motion-art lg:col-span-6 {% if loop.index is even %}lg:order-2 lg:col-start-7{% endif %}" data-scroll-reveal>{{ ticks() }}<canvas data-art="{{ row.art }}" aria-hidden="true" class="absolute inset-0 h-full w-full"></canvas><span class="absolute bottom-3 left-3 label z-10 bg-ink/80 px-1.5 py-0.5">{{ row.caption }}</span></div>
<div class="motion-copy lg:col-span-5 {% if loop.index is even %}lg:order-1 lg:col-start-1{% else %}lg:col-start-8{% endif %}" data-scroll-reveal><p class="label mb-4">{{ row.tag }}</p><h3 class="heading text-[36px] md:text-[44px] lg:text-[52px]">{{ row.title }}</h3><p class="mt-4 max-w-[46ch] text-[15px] leading-[1.65] text-paper/70">{{ row.body }}</p>{{ chip_list(row.chips) }}</div>
</div></article>{% endfor %}</section>

<section id="work" class="relative border-t border-line" data-rail>
  <div class="shell pt-24 md:pt-32 lg:pt-40">
    <p class="chapter-tag mb-6 md:mb-8">[ 02 / 04 ] · Work</p>
    <h2 class="h2-display" data-split>Selected work</h2>
    <p class="mt-6 max-w-[52ch] text-paper/70">{{profile.work_intro}}</p>
    <p class="label mt-6">All public on GitHub · {{profile.projects|length}} projects</p>
  </div>
  <div data-rail-wrapper>
    <div data-rail-viewport>
      <div data-rail-track class="shell mt-12 grid gap-6 pb-24 md:grid-cols-2 md:gap-6 md:pb-32">
        {% for project in profile.projects %}
        {% set project_index = loop.index %}{% include 'partials/project_card.html' %}
        {% endfor %}
      </div>
      <div data-rail-progress hidden class="mt-6 flex items-center gap-4 px-10 xl:px-12"><span data-rail-count class="label">01 / 06</span><div class="relative h-px flex-1 bg-line"><div data-rail-fill class="absolute inset-y-0 left-0 w-full origin-left bg-paper"></div></div><span class="label">Scroll →</span></div>
    </div>
  </div>
</section>
